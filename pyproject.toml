[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autumn-cli"
version = "0.1.0"
description = "A Textual terminal dashboard for GEPA prompt-optimization runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "gepa>=0.1",
    "httpx>=0.27",
    "textual>=8.2",
    "groq>=0.11",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.urls]
Homepage = "https://github.com/blokboy/autumn"
Repository = "https://github.com/blokboy/autumn"
Issues = "https://github.com/blokboy/autumn/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "textual-dev"]

[project.scripts]
autumn = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
