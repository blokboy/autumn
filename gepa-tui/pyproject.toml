[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autumn"
version = "0.1.0"
description = "A Textual terminal dashboard for GEPA prompt-optimization runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gepa>=0.1",
    "textual>=8.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "textual-dev"]

[project.scripts]
autumn = "autumn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autumn"]
